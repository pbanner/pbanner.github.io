name: Build Electric Fields Visualizer

on:
  push:
    branches:
      - main
    paths:
      - 'sims/electric-fields/**'
      - '.github/workflows/build-electric-fields.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allows the action to push code to the repo
      pull-requests: write # Use this if your action adds PR comments
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      
      - name: Install dependencies
        working-directory: ./sims/electric-fields
        run: npm install
      
      - name: Build simulation
        working-directory: ./sims/electric-fields
        run: npm run build
      
      - name: Commit and push dist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sims/electric-fields/dist/
          git commit -m "Build: update electric-fields dist folder" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) - rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done